spring:
  application:
    name: m09-backend
  datasource:
    url: jdbc:sqlite:${M09_DB_PATH:./runtime/m09.sqlite}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
server:
  port: ${M09_PORT:8080}
m09:
  model:
    command: ${M09_MODEL_COMMAND:}
    timeout-ms: ${M09_MODEL_TIMEOUT_MS:15000}
